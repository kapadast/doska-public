<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Доска направлений</title>
  <meta name="theme-color" content="#041208" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <style>
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #020805; color: #c8f5c4; display: flex; min-height: 100vh; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: .35; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 4px); }
    aside { width: 72px; flex: none; align-self: flex-start; position: sticky; top: 0; height: 100vh; box-sizing: border-box; background: #06140c; padding: 16px 10px; border-right: 2px solid #1f8a3a; box-shadow: inset -12px 0 24px rgba(40,255,80,.08); }
    aside h1 { margin: 4px 0 16px; text-align: center; font-size: 11px; letter-spacing: .12em; color: #c6ff9a; }
    aside nav { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    aside button { width: 42px; height: 42px; margin: 0; padding: 0; border: 1px solid #1f8a3a; border-radius: 8px; background: #041208; color: #8dff78; font-size: 18px; }
    aside button.on { background: #14381c; color: #d8ffc4; box-shadow: 0 0 12px rgba(80,255,90,.45); }
    aside { display: none; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 18px; position: sticky; top: 0; z-index: 30; background: rgba(4, 16, 10, .82); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(31, 138, 58, .45); }
    header nav, header .tools { display: flex; gap: 8px; flex-wrap: wrap; }
    header button { margin: 0; background: #041208; color: #8dff78; border: 1px solid #1f8a3a; box-shadow: none; }
    header button.on, #spend button.on, #habits button.on { background: #14381c; color: #d8ffc4; box-shadow: 0 0 10px rgba(80,255,90,.4); }
    aside button svg, header svg { width: 18px; height: 18px; display: block; fill: none; stroke: #8dff78; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    aside button.on svg, header button.on svg { stroke: #d8ffc4; }
    header i { display: inline-flex; vertical-align: -4px; margin-right: 6px; }
    .stage { flex: 1; min-width: 0; }
    h2 { margin: 0 0 8px; font-size: 18px; }
    .habits { margin: 8px 18px 12px; background: #07160e; border: 1px solid #1f8a3a; border-radius: 12px; padding: 12px; overflow-x: auto; box-shadow: inset 0 0 24px rgba(40,255,80,.08); }
    table { border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #145c28; min-width: 22px; height: 22px; text-align: center; padding: 0; }
    th.name, td.name { text-align: left; min-width: 180px; padding: 0 8px; position: sticky; left: 0; background: #07160e; }
    .sleep-grid th, .sleep-grid td { min-width: 30px; }
    .sleep-grid td { cursor: pointer; color: #d8ffc4; }
    .sleep-grid td.good { background: #1a6b32; }
    .sleep-grid td.mid { background: #6a5a10; }
    .sleep-grid td.bad { background: #6b2418; }
    .sleep-grid td.off { background: transparent; color: #145c28; cursor: default; }
    .sleep-grid td.pick { box-shadow: inset 0 0 0 2px #d8ffc4; }
    .sleep-swatch { width: 12px; height: 12px; display: inline-block; margin-right: 4px; vertical-align: -2px; border: 1px solid #1f8a3a; }
    .habits td.habit { height: auto; min-width: 180px; white-space: nowrap; padding: 4px 8px; }
    #tree { overflow: auto; padding: 16px 22px 48px; background: radial-gradient(ellipse at 50% 0, #12321c 0, #020805 52%); }
    .rpg-top, .tree-col, .tree-kids { display: flex; flex-direction: column; align-items: center; }
    .tree-board { display: flex; gap: 28px; align-items: flex-start; width: max-content; padding: 8px 12px 24px; }
    .rpg-orb { width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #d8ffc4; background: #041208; border: 3px solid #1f8a3a; box-shadow: inset 0 0 12px rgba(80,255,90,.25); }
    .rpg-orb.hot { border-color: #d6ff4a; color: #f3ffc4; box-shadow: 0 0 16px rgba(198,255,74,.55), inset 0 0 14px rgba(198,255,74,.25); }
    .rpg-orb.mid { border-color: #5dff6a; box-shadow: 0 0 10px rgba(93,255,106,.35); }
    .rpg-orb.hero { width: 96px; height: 96px; font-size: 34px; border-color: #c6ff4a; box-shadow: 0 0 22px rgba(198,255,74,.45); }
    .rpg-name { margin-top: 6px; max-width: 120px; text-align: center; font-size: 13px; color: #d8ffc4; }
    .rpg-xp { font-size: 11px; color: #6dcc78; }
    .rpg-status { font-size: 10px; color: #c6ff9a; max-width: 92px; text-align: center; line-height: 1.2; }
    .rpg-orb.locked { border-color: #3a3a3a; color: #6a6a6a; background: #121212; box-shadow: none; }
    .rpg-name.locked, .rpg-xp.locked { color: #5c5c5c; }
    .rpg-link { width: 2px; height: 26px; background: linear-gradient(#c6ff4a, #145c28); box-shadow: 0 0 6px rgba(198,255,74,.35); }
    .rpg-link.locked { background: #3a3a3a; box-shadow: none; }
    .tree-kids { gap: 0; margin-top: 0; }
    td.on { background: #1a6b32; }
    td.off { background: #1a120c; }
    .hero-line { height: 12px; background: #041208; border: 1px solid #1f8a3a; border-radius: 8px; overflow: hidden; margin: 4px 0 10px; }
    .hero-line > span { display: block; height: 100%; }
    .hp > span { background: #ff5a36; box-shadow: 0 0 8px #ff5a36; }
    .xp > span { background: #c6ff4a; box-shadow: 0 0 8px #c6ff4a; }
    .bar { height: 10px; background: #041208; border-radius: 6px; overflow: hidden; min-width: 80px; }
    .bar > span { display: block; height: 100%; background: #5dff6a; }
    main { display: flex; flex-direction: column; gap: 8px; padding: 8px 18px 24px; align-items: stretch; }
    #overview { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; padding: 12px 22px 28px; }
    .day-pulse { grid-column: 1 / -1; margin: 0; padding: 14px 16px; border: 1px solid #1f8a3a; border-radius: 12px; background: #071a0c; color: #d8ffc4; font-size: 18px; }
    .day-pulse p { margin: 0; }
    .day-pulse p + p { margin-top: 6px; font-size: 15px; color: #b7e8b4; }
    .vault { grid-column: 1 / -1; display: grid; grid-template-columns: 180px 1fr 1fr; gap: 16px; align-items: center; }
    .vault img { width: 170px; height: auto; display: block; mix-blend-mode: screen; }
    .skill-row { margin: 0 0 10px; }
    .skill-row > span { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .skill-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #d8ffc4; }
    .skill-rank { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 22px; padding: 0 5px; border-radius: 6px; font-size: 13px; font-weight: 800; border: 1px solid; }
    .skill-rank.low { color: #7fbf86; border-color: #2f6b3a; background: rgba(47, 107, 58, .15); }
    .skill-rank.mid { color: #c6ff9a; border-color: #6dcc78; background: rgba(109, 204, 120, .15); }
    .skill-rank.high { color: #0b1a0d; border-color: #d8ff5a; background: #c6ff3a; box-shadow: 0 0 10px rgba(198, 255, 58, .55); }
    .skill-xp { font-size: 11px; color: #6dcc78; }
    .skill-xp.ready { color: #0b1a0d; background: #ffd84a; padding: 2px 6px; border-radius: 5px; font-weight: 700; }
    .skill-help { width: 18px; height: 18px; padding: 0; margin: 0; border: 1px solid #2f6b3a; border-radius: 50%; background: #041208; color: #8dff78; font: 700 11px/16px Consolas, monospace; box-shadow: none; cursor: pointer; }
    .skill-help:hover { border-color: #c6ff4a; color: #d8ffc4; }
    .skill-up { width: 18px; height: 18px; padding: 0; margin: 0; border: 1px solid #ffd84a; border-radius: 50%; background: #ffd84a; color: #0b1a0d; font: 700 12px/16px Consolas, monospace; box-shadow: none; cursor: pointer; }
    .skill-proof { margin: -5px 0 7px; color: #8dc995; font-size: 10px; line-height: 1.25; }
    .development-dashboard { grid-column: 1 / -1; }
    .development-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
    .development-card { padding: 12px; border: 1px solid #145c28; border-radius: 10px; background: #041208; }
    .development-card h3 { margin: 0 0 7px; color: #d8ffc4; font-size: 14px; }
    .development-card p { margin: 4px 0; font-size: 12px; line-height: 1.4; }
    .development-card strong { color: #c6ff9a; }
    .task-dashboard { grid-column: 1 / -1; }
    .task-dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .task-dashboard h3 { margin: 4px 0 8px; }
    .task-dashboard .late-task { color: #ff8a70; }
    @media (max-width: 850px) { .task-dashboard-grid { grid-template-columns: 1fr; } }
    #links { padding: 12px 22px 40px; max-width: 920px; }
    #links h2 { margin: 22px 0 8px; }
    #links table { width: 100%; border-collapse: collapse; font-size: 14px; }
    #links th, #links td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #1f8a3a; vertical-align: top; }
    #links th { color: #6dcc78; font-weight: 600; }
    #links td:first-child { color: #d8ffc4; width: 28%; }
    .tile { border-radius: 16px; padding: 18px 20px; min-height: 92px; border: 1px solid #1f8a3a; }
    .tile small { display: block; color: #6dcc78; }
    .tile b { display: block; margin-top: 6px; font-size: 34px; letter-spacing: -.04em; color: #d8ffc4; }
    .tile.peach { background: #102818; }
    .tile.mint { background: #0c2014; }
    #overview[hidden], main[hidden], .habits[hidden], [hidden] { display: none !important; }
    #overview section h2 { margin-top: 0; }
    section { background: #07160e; border: 1px solid #1f8a3a; border-radius: 16px; padding: 16px 18px; box-shadow: inset 0 0 28px rgba(40,255,80,.07); }
    section.ok { background: #0c2416; }
    section.soon { background: #241c08; border-color: #c6a000; }
    section.urgent { background: #240e0c; border-color: #ff5a36; }
    details.top { display: flex; align-items: flex-start; gap: 12px; }
    details.top > summary { width: 180px; flex: none; padding-top: 6px; }
    .side { display: flex; gap: 12px; align-items: flex-start; }
    .col { min-width: 420px; max-width: 560px; }
    details.kid { display: flex; align-items: flex-start; gap: 8px; background: transparent; padding: 0; margin: 0; }
    details.top:not([open]) > .side, details.kid:not([open]) > .col { display: none; }
    details summary { cursor: pointer; font-size: 17px; font-weight: 650; list-style: none; padding: 4px 0; }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "▸ "; color: #5dff6a; }
    details[open] > summary::before { content: "▾ "; }
    details details { margin: 10px 0 0; padding: 8px 10px; background: #041208; border: 1px solid #145c28; border-radius: 10px; }
    .task { display: grid; grid-template-columns: 18px 1fr; gap: 4px 8px; align-items: start; margin: 8px 0; padding: 8px; background: #041208; border: 1px solid #145c28; border-radius: 10px; }
    .task.ok { background: #0c2416; border-color: #1f8a3a; }
    .task.soon { background: #241c08; border-color: #c6a000; }
    .task.urgent { background: #240e0c; border-color: #ff5a36; }
    .task span { line-height: 1.35; }
    .task .meta { grid-column: 2; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .note { grid-column: 2; max-width: 520px; color: #6dcc78; font-size: 14px; line-height: 1.45; }
    .task textarea { grid-column: 2; width: 100%; box-sizing: border-box; min-height: 52px; border: 1px solid #1f8a3a; border-radius: 8px; padding: 6px; font: inherit; background: #041208; color: #8dff78; }
    #archive details { margin: 8px 0; border: 1px solid #1f8a3a; border-radius: 10px; background: #041208; }
    #archive summary { cursor: pointer; padding: 8px 12px; }
    #archive .arch-item { display: block; width: 100%; box-sizing: border-box; padding: 8px 12px; border-top: 1px solid #145c28; cursor: pointer; }
    #archive .arch-item small { display: block; color: #6dcc78; font-size: 12px; }
    .sub-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
    .sub-nav button { padding: 5px 10px; font-size: 12px; }
    .ladder { border: 1px solid #1f8a3a; border-radius: 10px; background: #041208; padding: 12px; }
    .ladder h2 { margin: 0 0 4px; }
    .ladder .meta { margin: 4px 0 10px; color: #6dcc78; line-height: 1.45; }
    .ladder ul { margin: 4px 0 10px 18px; padding: 0; line-height: 1.45; }
    .ladder table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ladder th, .ladder td { padding: 7px 8px; border-top: 1px solid #145c28; vertical-align: top; text-align: left; line-height: 1.4; }
    .ladder th { color: #6dcc78; font-weight: normal; border-top: none; }
    .ladder td:first-child { white-space: nowrap; color: #d8ffc4; }
    .ladder tr.cur td { background: #0b3a17; color: #d8ffc4; }
    .ladder tr.cur td:first-child::after { content: " ◀ ты"; color: #c6ff4a; }
    .ladder .next { margin: 0 0 10px; padding: 10px 12px; border: 1px solid #c6ff4a; border-radius: 10px; }
    .ladder a { color: #c6ff4a; }
    .lamp { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
    .lamp.ok { background: #5dff6a; box-shadow: 0 0 6px #5dff6a; }
    .lamp.soon { background: #ffb000; box-shadow: 0 0 6px #ffb000; }
    .lamp.urgent { background: #ff5a36; box-shadow: 0 0 6px #ff5a36; }
    .hint { margin: 4px 2px 10px; color: #6dcc78; }
    .work-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .work-form input[type="text"] { width: 280px; margin-top: 0; }
    .work-form input[type="number"] { width: 90px; }
    .work-form select { max-width: none; }
    .pie { display: flex; gap: 16px; align-items: center; }
    .pie ul { list-style: none; padding: 0; margin: 8px 0; }
    .pie li { margin: 4px 0; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .stat b { display: inline-block; width: 160px; }
    .week-head { display: flex; gap: 8px; align-items: center; }
    .week-goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .week-goals input { margin-top: 0; }
    .week-board { display: grid; grid-template-columns: 220px repeat(7, minmax(160px, 1fr)); gap: 8px; overflow-x: auto; }
    .week-col { min-height: 260px; padding: 8px; background: #041208; border: 1px solid #1f8a3a; border-radius: 12px; }
    .week-col.today { border: 2px solid #c6ff4a; box-shadow: 0 0 12px rgba(198,255,74,.35); }
    .week-col h3 { margin: 0 0 8px; }
    .week-card { margin: 6px 0; padding: 8px; background: #07160e; border: 1px solid #145c28; border-radius: 9px; font-size: 13px; }
    .week-card.ok { background: #0c2416; border-color: #1f8a3a; }
    .week-card.soon { background: #241c08; border-color: #c6a000; }
    .week-card.urgent { background: #240e0c; border-color: #ff5a36; }
    .week-card small { display: block; color: #6dcc78; margin-bottom: 3px; }
    .week-card input[type="date"] { width: 100%; box-sizing: border-box; margin-top: 6px; }
    .week-count { color: #6dcc78; font-size: 12px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(140px, 1fr)); gap: 7px; }
    .calendar-day { min-height: 130px; padding: 7px; background: #041208; border: 1px solid #1f8a3a; border-radius: 10px; }
    .calendar-day.outside { opacity: .42; }
    .calendar-day.today { border: 2px solid #c6ff4a; }
    .calendar-day h3 { margin: 0 0 5px; font-size: 14px; }
    .calendar-day .week-card { padding: 6px; }
    .calendar-add { width: 100%; margin-top: 5px; background: #041208; color: #8dff78; border: 1px solid #1f8a3a; }
    dialog { border: 1px solid #1f8a3a; border-radius: 14px; padding: 18px; min-width: 380px; background: #07160e; color: #8dff78; }
    dialog::backdrop { background: rgba(2,8,5,.72); }
    #bench-dialog { width: min(920px, 88vw); max-height: 82vh; overflow: auto; }
    #skill-help-dialog { width: min(760px, 88vw); max-height: 82vh; overflow: auto; }
    #skill-help-body p { line-height: 1.45; }
    #skill-help-body h3 { color: #d8ffc4; margin: 16px 0 6px; }
    #skill-help-body table { width: 100%; margin: 8px 0 14px; }
    #skill-help-body th, #skill-help-body td { text-align: left; padding: 5px 7px; }
    .bench-card { margin: 10px 0; padding: 12px; border: 1px solid #1f8a3a; border-radius: 10px; background: #041208; }
    .bench-card h3 { margin: 0 0 6px; color: #d8ffc4; }
    .bench-card p { margin: 5px 0; line-height: 1.45; }
    .bench-card a { color: #c6ff4a; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .week-card { cursor: pointer; }
    #calendar-task-delete { color: #ff5a36; border-color: #ff5a36; margin-right: auto; }
    .subscription-form, .subscription-row { display: grid; grid-template-columns: 1.5fr 110px 90px 130px 150px 1.5fr auto; gap: 8px; align-items: center; }
    .subscription-form input, .subscription-form select, .subscription-row input, .subscription-row select { width: 100%; box-sizing: border-box; margin: 0; }
    .subscription-row { margin: 8px 0; padding: 8px; background: #041208; border: 1px solid #145c28; border-radius: 10px; }
    .mark { margin: 0; background: #241c08; color: #ffb000; border: 1px solid #c6a000; border-radius: 10px; }
    .mark.on { background: #14381c; color: #d8ffc4; }
    input, button, textarea, select { font: inherit; color: #8dff78; }
    input[type="text"], input[type="number"], textarea { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 6px 8px; border: 1px solid #1f8a3a; border-radius: 8px; background: #041208; }
    button { margin-top: 8px; border: 1px solid #1f8a3a; background: #0c2416; color: #d8ffc4; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    button.mark { margin: 0; background: #241c08; color: #ffb000; border: 1px solid #c6a000; }
    button.mark.on { background: #14381c; color: #d8ffc4; border-color: #5dff6a; }
    button.x { margin: 0; padding: 0 6px; background: transparent; color: #ff5a36; border: 0; border-radius: 6px; font-size: 16px; line-height: 1; }
    button.quiet { margin: 0; background: #041208; color: #8dff78; border: 1px solid #1f8a3a; padding: 4px 8px; }
    .done { text-decoration: line-through; color: #3d7a48; }
    .due { color: #6dcc78; font-size: 12px; white-space: nowrap; }
    .late { color: #ff5a36; font-weight: 600; }
    input[type="checkbox"] { accent-color: #5dff6a; }
    input[type="date"], select { border: 1px solid #1f8a3a; border-radius: 8px; padding: 4px 6px; background: #041208; font: inherit; font-size: 12px; color: #8dff78; color-scheme: dark; }
    select { max-width: 140px; }
    header nav.tab-groups { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .group-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
    #overview.overview-studio:not([hidden]) { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; padding: 12px 22px 28px; }
    #overview.overview-studio > .dash-studio,
    #overview.overview-studio > .kanban-glass,
    #overview.overview-studio > .vault,
    #overview.overview-studio > .development-dashboard,
    #overview.overview-studio > .glass-week { grid-column: 1 / -1; }
    .dash-studio { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: center; padding: 20px 22px; border-radius: 20px; border: 1px solid rgba(141, 255, 120, 0.32); background: linear-gradient(135deg, rgba(10, 32, 18, 0.94), rgba(4, 14, 8, 0.82)); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(198, 255, 74, 0.1); }
    .dash-greeting { margin: 0 0 6px; font-size: 26px; font-weight: 700; color: #e8ffd8; letter-spacing: -0.02em; text-shadow: none; }
    .dash-date { margin: 0 0 14px; font-size: 14px; color: #8dc995; line-height: 1.45; text-shadow: none; }
    .dash-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .dash-actions button { border-radius: 999px; padding: 8px 16px; font-size: 13px; }
    .habit-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .habit-pill { margin: 0; padding: 5px 11px; border-radius: 999px; font-size: 12px; background: rgba(4, 18, 8, .78); border: 1px solid #1f8a3a; color: #8dc995; }
    .habit-pill.on { background: #14381c; border-color: #c6ff4a; color: #e8ffd8; box-shadow: 0 0 10px rgba(198, 255, 74, .32); }
    .activity-rings { display: flex; align-items: center; justify-content: center; gap: 22px; }
    .ring-legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d8ffc4; }

  <script>
    let tab = "overview";
    let workDraft = null;
    let spendMonth = "";
    let habitView = "";
    function showTab(name) {
      tab = name;
      document.getElementById("habits").hidden = name !== "habits";
      document.getElementById("overview").hidden = name !== "overview";
      document.getElementById("today").hidden = name !== "today";
      document.getElementById("week").hidden = name !== "week";
      document.getElementById("archive").hidden = name !== "archive";
      document.getElementById("work").hidden = name !== "work";
      document.getElementById("journal").hidden = name !== "journal";
      document.getElementById("subscriptions").hidden = name !== "subscriptions";
      document.getElementById("bench").hidden = name !== "bench";
      document.getElementById("recs").hidden = name !== "recs";
      document.getElementById("links").hidden = name !== "links";
      if (name === "links") drawLinks();
      document.getElementById("tree").hidden = name !== "tree";
      if (name === "tree") drawTree();
      document.getElementById("activity").hidden = name !== "activity";
      if (name === "activity") drawActivity();
      document.getElementById("food").hidden = name !== "food";
      if (name === "food") drawFood();
      document.getElementById("sleep").hidden = name !== "sleep";
      if (name === "sleep") drawSleep();
      document.getElementById("state").hidden = name !== "state";
      if (name === "state") drawState();
      document.getElementById("spend").hidden = name !== "spend";
      if (name === "spend") drawSpend();
      document.getElementById("board").hidden = name !== "board";
      if (name === "today" || name === "board") draw();
      if (name === "overview") drawOverview();
      if (name === "week") drawWeek();
      if (name === "archive") drawArchive();
      if (name === "work") drawWork();
      if (name === "journal") drawJournal();
      if (name === "habits") drawHabits();
      if (name === "subscriptions") drawSubscriptions();
      if (name === "bench") drawLadders("bench");
      if (name === "recs") drawLadders("recs");
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.classList.toggle("on", button.dataset.tab === name);
      });
      const menu = document.getElementById("tab-menu");
      const current = document.querySelector("header [data-tab].on");
      if (menu && current) menu.textContent = current.textContent.replace(/\s+/g, " ").trim();
      document.querySelector("header").classList.remove("menu-open");
      document.body.classList.remove("menu-open");
      foldPhoneLists(document.getElementById(name));
    }
    function foldPhoneLists(root) {
      if (!root || !window.matchMedia("(max-width: 720px)").matches) return;
      const blocks = root.querySelectorAll("section.kanban-glass, .vault > div, section.development-dashboard, section.glass-week, .task-dashboard-grid > div, .development-card, .week-col, .calendar-day, .subscription-row, .bench-card, table");
      blocks.forEach((block) => {
        if (block.querySelector(":scope > details.phone-fold")) return;
        const details = document.createElement("details");
        details.className = "phone-fold";
        const summary = document.createElement("summary");
        const head = block.querySelector(":scope > h2, :scope > h3");
        const body = document.createElement("div");
        body.className = "phone-fold-body";
        if (head) summary.textContent = (head.childNodes[0] && head.childNodes[0].textContent || head.textContent).trim();
        else if (block.tagName === "TABLE") summary.textContent = "Таблица месяца";
        else if (block.classList.contains("subscription-row")) {
          const field = block.querySelector("input");
          summary.textContent = (field && field.value.trim()) || "Подписка";
        } else summary.textContent = "Список";
        if (block.tagName === "TABLE") {
          block.replaceWith(details);
          body.appendChild(block);
        } else {
          while (block.firstChild) body.appendChild(block.firstChild);
          block.appendChild(details);
        }
        details.append(summary, body);
      });
    }
    document.querySelectorAll("[data-tab]").forEach((button) => {
      button.onclick = () => showTab(button.dataset.tab);
    });
    document.getElementById("tab-menu").onclick = (event) => {
      event.stopPropagation();
      const header = document.querySelector("header");
      header.classList.toggle("menu-open");
      document.body.classList.toggle("menu-open", header.classList.contains("menu-open"));
    };
    document.addEventListener("click", (event) => {
      const header = document.querySelector("header");
      const dock = document.getElementById("quick-dock");
      if (header.classList.contains("menu-open") && !header.contains(event.target)) {
        header.classList.remove("menu-open");
        document.body.classList.remove("menu-open");
      }
      const panel = document.getElementById("quick-panel");
      if (!panel.hidden && dock && !dock.contains(event.target)) panel.hidden = true;
    });
    const quickPanel = document.getElementById("quick-panel");
    document.getElementById("quick-toggle").onclick = () => {
      quickPanel.hidden = !quickPanel.hidden;
    };
    document.getElementById("quick-task").onclick = () => {
      quickPanel.hidden = true;
      openTaskDialog(localIso(new Date()));
    };
    document.getElementById("quick-week").onclick = () => {
      quickPanel.hidden = true;
      showTab("week");
    };
    document.getElementById("quick-note").onclick = () => {
      quickPanel.hidden = true;
      journalDay = localIso(new Date());
      showTab("journal");
      const area = document.querySelector("#journal textarea");
      if (area) area.focus();
    };
    async function askHelper(kind) {
      const out = document.getElementById("quick-ai-out");
      const text = document.getElementById("quick-ask").value.trim();
      out.textContent = "Смотрю…";
      try {
        const response = await fetch("api/helper", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind, text })
        });
        const body = await response.json();
        out.textContent = body.message || "Не вышло.";
        if (body.ok && kind !== "today") {
          document.getElementById("quick-ask").value = "";
          await load();
        }
      } catch (error) {
        out.textContent = "Нет связи с помощником.";
      }
    }
    document.getElementById("quick-ai-task").onclick = () => askHelper("task");
    document.getElementById("quick-ai-note").onclick = () => askHelper("note");
    document.getElementById("quick-ai-today").onclick = () => askHelper("today");
    let voiceRec = null;
    document.getElementById("quick-mic").onclick = async () => {
      const out = document.getElementById("quick-ai-out");
      if (voiceRec && voiceRec.state === "recording") {
        voiceRec.stop();
        return;
      }
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        out.textContent = "Этот браузер не пишет звук. Открой сайт в Safari.";
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "audio/mp4";
        voiceRec = new MediaRecorder(stream, { mimeType: mime });
        const chunks = [];
        voiceRec.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
        voiceRec.onstop = async () => {
          stream.getTracks().forEach((track) => track.stop());
          out.textContent = "Разбираю…";
          try {
            const response = await fetch("api/voice", {
              method: "POST",
              headers: { "Content-Type": mime },
              body: new Blob(chunks, { type: mime })
            });
            const body = await response.json();
            if (body.text) {
              const area = document.getElementById("quick-ask");
              area.value = (area.value ? area.value.trim() + " " : "") + body.text;
            }
            out.textContent = body.text || body.message || "Ничего не разобрал.";
          } catch (error) {
            out.textContent = "Голос не дошёл.";
          }
        };
        voiceRec.start();
        document.getElementById("quick-mic").textContent = "Стоп";
        out.textContent = "Слушаю. Нажми Стоп, когда договоришь.";
        voiceRec.addEventListener("stop", () => {
          document.getElementById("quick-mic").textContent = "Голос";
        });
      } catch (error) {
        out.textContent = "Нет доступа к микрофону.";
      }
    };
    const icons = {

    function tone(items) {
      let rank = 0;
      (items || []).forEach((item) => {
        if (!item.due || item.done) return;
        const left = daysLeft(item.due);
        const now = left <= 1 ? 3 : left < 3 ? 2 : 1;
        if (now > rank) rank = now;
      });
      return rank === 3 ? "urgent" : rank === 2 ? "soon" : rank === 1 ? "ok" : "";
    }
    function daysLeft(iso) {
      if (!iso) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((new Date(iso + "T00:00:00") - today) / 86400000);
    }
    function nextDate(iso, repeat) {
      const day = iso ? new Date(iso + "T00:00:00") : new Date();
      if (repeat === "daily") day.setDate(day.getDate() + 1);
      if (repeat === "every2") day.setDate(day.getDate() + 2);
      if (repeat === "weekly") day.setDate(day.getDate() + 7);
      if (repeat === "monthly") day.setMonth(day.getMonth() + 1);
      return localIso(day);
    }

        const card = document.createElement("div");
        card.className = "bench-card";
        const title = document.createElement("h3");
        title.textContent = skill.name + (profile.mode === "practice"
          ? " · профиль практики"
          : score === null
            ? " · не оценено"
            : " · " + score + " ±" + (masterySpread(skill) || 0));
        const zero = document.createElement("p");
        zero.textContent = "Смысл: " + profile.definition;
        const first = document.createElement("p");
        first.textContent = "Следующее доказательство: " + profile.next;
        const face = document.createElement("p");
        face.textContent = exemplarText(skill.id, score);
        const second = document.createElement("p");
        second.textContent = profile.mode === "practice" ? "Максимум: не применяется." : "10 000: " + profile.max;
        card.append(title, zero, first, face, second);
        (profile.sources || []).forEach((source) => {
          const link = document.createElement("a");
          link.href = source;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = "Источник";
          card.appendChild(link);
        });
        root.appendChild(card);
      });

    function developmentGuide(id) {
      return developmentGuides[id] || ["Практика по выбранной роли", "Обязательного сертификата нет", "Измеримый результат следующей ступени", "Рабочий артефакт и внешняя проверка"];

    function nextMasteryTarget(skill) {
      const profile = masteryProfile(skill.id);
      const score = masteryScore(skill);
      if (profile.mode === "practice") return { current: "профиль практики", next: profile.next };
      if (score === null) return { current: "уровень пока не подтверждён", next: profile.next };
      const step = masteryStep(score);
      const nextMark = Math.min(10000, Math.ceil((score + 1) / 1000) * 1000);
      const rows = measuredRows(skill.id);
      const row = rows.find((item) => item[0] === nextMark);
      return {
        current: score + " из 10 000 · ступень " + step + " «" + masteryBandName(skill.id, score) + "»",
        next: profile.next + (row ? " Ориентир " + nextMark + ": " + row[2] + "." : "")
      };
    }
    function claimText(skill) {

      if (score === null) return "Рыночную ступень пока рано заявлять: сначала нужно подтверждение.";
      if (score < 3000) return "Можно претендовать на учебные и исполнительские задачи под проверкой.";
      if (score < 5000) return "Можно претендовать на самостоятельные задачи в роли: " + market[1] + ".";
      if (score < 7000) return "Можно претендовать на ведение процесса с метриками в роли: " + market[1] + ".";

    const paramBoost = { an: ["int"], mp: ["int"], au: ["int"], site: ["int"], en: ["int"], bk: ["int", "per"], mk: ["int"] };
    const skillFeed = { med: { per: 0.5 }, bk: { int: 0.25 }, spk: { cha: 0.5 } };
    function boostedXp(id, xp) {
      const options = paramBoost[id];
      if (!options || !xp) return xp;
      const levels = options.map((pid) => {
        const row = (data.skills || []).find((skill) => skill.id === pid);
        return row ? row.level : 1;
      });
      const level = levels.length > 1 ? 0.7 * Math.max(...levels) + 0.3 * Math.min(...levels) : levels[0];
      const factor = Math.min(1.3, 1 + 0.03 * Math.max(0, level - 1));

    function sleepFactor(date) {
      const hours = Number((data.sleep || {})[date] || 0);
      if (!hours) return 1;
      if (hours < 4) return 0.6;

      if (hours < 6) return 0.85;
      if (hours < 7) return 0.95;

    function grantSkill(id, xp, reason, ready) {

      const skill = data.skills.find((row) => row.id === id);
      if (!skill || !xp) return [];
      if (!ready) xp = scaleSleep(localIso(new Date()), xp);
      const base = xp;
      const boosted = boostedXp(skill.id, xp);
      skill.xp = Math.max(0, skill.xp + boosted);
      if (skill.level >= 10) skill.xp = Math.min(skill.xp, skillNeed(10));
      logXp("skill", skill.id, boosted, reason);
      const given = [{ id: skill.id, delta: boosted }];
      Object.entries(skillFeed[skill.id] || {}).forEach(([targetId, share]) => {
        const target = data.skills.find((row) => row.id === targetId);
        const part = Math.round(base * share);
        if (!target || !part) return;
        target.xp = Math.max(0, target.xp + part);
        if (target.level >= 10) target.xp = Math.min(target.xp, skillNeed(10));
        logXp("skill", target.id, part, "от " + skill.name.toLowerCase());
        given.push({ id: target.id, delta: part });
      });

    }

            if (tab === "overview") drawOverview();
          };
          const where = document.createElement("div");
          where.className = "kcard-proj";
          where.textContent = group.parent ? group.parent + " / " + group.title : group.title;
          const titleEl = document.createElement("div");
          titleEl.className = "kcard-title";
          titleEl.textContent = item.text;
          const due = document.createElement("div");
          due.className = "kcard-due";
          due.textContent = item.due;
          cardEl.onclick = () => openTaskEditor(group, item);
          cardEl.append(box, where, titleEl, due);
          column.appendChild(cardEl);
        });
        return column;
      };
      columns.append(
        makeColumn("Сегодня", due, false),
        makeColumn("Скоро", soon, false),
        makeColumn("Просрочено", late, true)
      );
      box.append(title, columns);
      return box;
    }
    function drawOverview() {
      const root = document.getElementById("overview");
      root.className = "overview-studio";
      root.replaceChildren();
      let bare = 0;
      (data.boards || []).forEach((col) => {
        (col.items || []).forEach((item) => {
          if (item.done) return;
          if (!item.due) bare += 1;
        });
      });
      let openTasks = 0;
      (data.boards || []).forEach((col) => (col.items || []).forEach((item) => { if (!item.done) openTasks += 1; }));
      const weekAgo = new Date();
      weekAgo.setDate(weekAgo.getDate() - 6);
      weekAgo.setHours(0, 0, 0, 0);
      let weekMinutes = 0;
      timeRows().forEach((row) => {
        const day = new Date(row.date + "T00:00:00");
        if (day >= weekAgo) weekMinutes += Number(row.minutes || 0);
      });
      const vault = document.createElement("section");
      vault.className = "vault";
      const figure = document.createElement("img");
      figure.src = "vault-guy.png";
      figure.alt = "";
      const columns = { "Навыки": document.createElement("div"), "Субнавыки": document.createElement("div") };
      Object.entries(columns).forEach(([name, column]) => {
        const title = document.createElement("h2");
        title.textContent = name;
        column.appendChild(title);
      });
      ensureSkills();
      data.skills.forEach((skill) => {
        const need = skillNeed(skill.level);
        const profile = masteryProfile(skill.id);
        const score = masteryScore(skill);
        const spread = masterySpread(skill);
        const step = masteryStep(score);
        const row = document.createElement("div");
        row.className = "skill-row";
        const cap = document.createElement("span");
        const name = document.createElement("strong");
        name.className = "skill-name";
        const rank = document.createElement("b");
        rank.className = "skill-rank " + (step >= 7 ? "high" : step >= 4 ? "mid" : "low");
        rank.textContent = profile.mode === "practice" ? "практ." : (score === null ? "—" : (Math.round(score / 100) / 10 + "k"));
        rank.title = profile.mode === "practice"
          ? "Профиль практики без балла мастерства"
          : score === null
            ? "Не оценено"
            : score + " ±" + (spread || 0) + " из 10 000 · ступень " + step;
        const help = document.createElement("button");
        help.type = "button";
        help.className = "skill-help";
        help.textContent = "?";
        help.title = "Что означает навык, как измеряется и где оплачивается";
        help.onclick = () => openSkillHelp(skill);
        name.append(rank, document.createTextNode(skill.name), help);
        if (isCandidate(skill)) {
          const up = document.createElement("button");
          up.type = "button";
          up.className = "skill-up";
          up.textContent = "↑";
          up.title = "Тест и метрика для следующего уровня";
          up.onclick = () => openPromotion(skill);
          name.appendChild(up);
        }
        const xp = document.createElement("small");
        xp.className = "skill-xp";
        xp.textContent = skill.xp + "/" + need + " XP";
        if (isCandidate(skill)) {
          xp.className = "skill-xp ready";
          xp.textContent = "XP заполнен · нужно доказательство";
        }
        cap.append(name, xp);
        const line = document.createElement("div");
        line.className = "hero-line xp";
        const fill = document.createElement("span");
        fill.style.width = Math.max(0, Math.min(100, skill.xp / need * 100)) + "%";
        line.appendChild(fill);
        const proof = document.createElement("p");
        proof.className = "skill-proof";
        proof.textContent = profile.mode === "practice"
          ? "Ориентир и объяснение — по кнопке ?"
          : score === null
            ? "Не оценено · критерии по кнопке ?"
            : score + " ±" + (spread || 0) + " · " + masteryBandName(skill.id, score);
        row.append(cap, line, proof);
        (columns[skill.group] || columns["Субнавыки"]).appendChild(row);
      });
      const note = document.createElement("p");
      note.className = "hint";
      note.textContent = "Балл 0–10 000 показывает подтверждённое мастерство; XP — только практику. Для каждого навыка есть единая измеримая ось и виртуальный человек на каждой тысяче. Полная полоса XP просит новое доказательство, но сама балл не двигает. Все шкалы — во вкладке «Бенчмарки».";
      columns["Субнавыки"].appendChild(note);
      vault.append(figure, columns["Навыки"], columns["Субнавыки"]);
      const xpOn = (iso) => {
        const byId = {};
        (data.xpLog || []).forEach((row) => {
          const delta = Number(row.delta || 0);
          if (delta <= 0 || !row.at || row.kind === "gold") return;
          if (localIso(new Date(row.at)) !== iso) return;
          const id = row.kind === "hero" ? "hero" : row.id;
          if (!id) return;
          byId[id] = (byId[id] || 0) + delta;
        });
        return byId;
      };
      const now = new Date();
      const todayDay = now.getDate();
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      const todayBy = xpOn(localIso(now));
      const yesterdayBy = xpOn(localIso(yesterday));
      const sumOf = (bag) => Object.values(bag).reduce((sum, n) => sum + n, 0);
      const todayXp = sumOf(todayBy);
      const yesterdayXp = sumOf(yesterdayBy);
      const todayIso = localIso(now);
      let dueToday = 0;
      let doneDueToday = 0;
      (data.boards || []).forEach((col) => (col.items || []).forEach((item) => {
        if (item.due !== todayIso) return;
        dueToday += 1;
        if (item.done) doneDueToday += 1;
      }));
      const habitList = (data.habits || []).filter((h) => (h.name || "").toLowerCase() !== "сон");
      let habitDone = 0;
      habitList.forEach((h) => {
        if ((h.marks || [])[todayDay - 1] === "1") habitDone += 1;
      });
      const focusGoal = 14 * 60;
      const studio = drawDashStudio({
        summaryLine: (dueToday ? dueToday + " задач на сегодня" : "Нет задач с датой на сегодня")
          + (bare ? " · без даты " + bare : "")
          + (todayXp ? " · +" + todayXp + " XP" : ""),
        taskRatio: dueToday ? doneDueToday / dueToday : (openTasks ? 0 : 1),
        taskText: dueToday ? doneDueToday + "/" + dueToday : "—",
        focusRatio: Math.min(1, weekMinutes / focusGoal),
        focusText: weekMinutes >= 60 ? Math.round(weekMinutes / 60) + "ч" : weekMinutes + "м",
        habitRatio: habitList.length ? habitDone / habitList.length : 0,
        habitText: habitList.length ? habitDone + "/" + habitList.length : "—"
      });
      root.append(studio, drawTaskDashboard(todayIso), drawWeekXpBars());
      const totals = {};
      const recent = [];
      timeRows().forEach((row) => {
        const day = new Date(row.date + "T00:00:00");
        if (day < weekAgo) return;
        const key = row.direction || "Другое";
        const mins = Number(row.minutes || 0);
        if (mins > 0) totals[key] = (totals[key] || 0) + mins;
        recent.push(row);
      });
      const pairs = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      const timeCard = card("Время за 7 дней");
      if (!pairs.length) {
        const empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = "Записей нет. Они появятся из вкладки «Занятость».";
        timeCard.appendChild(empty);
      } else timeCard.appendChild(pie(pairs));
      root.appendChild(timeCard);

      const leadCard = card("Куда ушло больше всего");
      if (!pairs.length) {
        const empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = "Пока нечего сравнивать.";
        leadCard.appendChild(empty);
      } else {
        const mins = pairs[0][1];
        const hours = Math.floor(mins / 60);
        const lead = document.createElement("p");
        lead.textContent = pairs[0][0] + " — " + (hours ? hours + " ч " : "") + (mins % 60) + " мин";
        leadCard.appendChild(lead);
        recent.filter((row) => (row.direction || "Другое") === pairs[0][0]).slice(-3).reverse().forEach((row) => {
          const p = document.createElement("p");
          p.textContent = row.date + " · " + row.minutes + " мин · " + row.text;
          leadCard.appendChild(p);
        });
      }
      root.appendChild(leadCard);
      root.append(vault, drawDevelopmentDashboard());
    }
    function drawWork() {
      const root = document.getElementById("work");
      root.replaceChildren();
      const logs = data.logs || [];
      ensureSkills();
      const skillName = Object.fromEntries(data.skills.map((s) => [s.id, s.name]));
      const skillPick = (value, empty) => {
        const pick = document.createElement("select");
        pick.title = empty ? "Доп. навык получает половину опыта" : "Какой навык кормит это время";
        [["", empty || "Без навыка"], ...data.skills.map((s) => [s.id, s.name])].forEach(([id, name]) => {
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = name;
          if (id === (value || "")) opt.selected = true;
          pick.appendChild(opt);
        });
        return pick;
      };
      const names = [];
      (data.boards || []).forEach((board) => {
        const title = board.parent ? board.parent + " / " + board.title : board.title;
        if (title && !names.includes(title)) names.push(title);
      });
      ["Дом", "Спорт", "Работа", "Семья", "Хобби", "Чтение", "Отдых", "Другое"].forEach((name) => {
        if (!names.includes(name)) names.push(name);
      });
      const form = document.createElement("section");
      const lead = document.createElement("p");
      lead.className = "hint";
      lead.textContent = "Записывай, чем реально занимался. Направление и слова сами ставят навыки. Два доп. списка можно оставить пустыми. Если выберешь сам — они встанут первыми, по половине времени. Опыт: 2 за каждые 30 минут, не больше 12 в день на навык; герою 1 за 30 минут, не больше 4 в день. Монеты — только за задачи.";
      const todayIso = localIso(new Date());
      const heroToday = timeXpState()["hero|" + todayIso] || 0;
      if (heroToday >= 4) lead.textContent += " Лимит героя за сегодня по «Занятости» уже достигнут.";
      const row = document.createElement("div");
      row.className = "work-form";
      const minutes = document.createElement("input");
      minutes.type = "number";
      minutes.min = "5";
      minutes.step = "5";
      minutes.placeholder = "Минуты, можно пусто";
      const direction = document.createElement("select");
      names.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        direction.appendChild(opt);
      });
      const skill = skillPick(timeSkillByDirection[direction.value] || "");
      skill.title = "Главный навык";
      const extraA = skillPick("", "Доп. не обязательно");
      const extraB = skillPick("", "Доп. не обязательно");
      const guess = document.createElement("p");
      guess.className = "hint";
      const refreshGuess = () => {
        const picked = suggestTimeSkills(direction.value, what.value);
        if (!skill.dataset.hand) skill.value = picked.skill;
        const extra = chosenExtras(picked.extra, extraA.value, extraB.value, skill.value);
        const names = [skill.value, ...extra].filter(Boolean).map(skillTitle);
        guess.replaceChildren();
        const line = document.createElement("span");
        line.textContent = names.length ? "Пойдёт в: " + names.join(" + ") + (extra.length ? ". Первое — полностью, остальные — половина." : ".") : "По этим словам навык не нашёлся. Опыт получит только герой.";
        guess.appendChild(line);
        const word = direction.value && direction.value !== "спорт" ? freshWord(what.value) : "";
        if (!word) return;
        const ask = document.createElement("button");
        ask.type = "button";
        ask.className = "quiet";
        ask.textContent = "Добавить «" + word + "» в ключи «" + direction.value + "»?";
        ask.onclick = async () => {
          data.directionWords = data.directionWords || {};
          data.directionWords[direction.value] = data.directionWords[direction.value] || [];
          if (!data.directionWords[direction.value].includes(word)) data.directionWords[direction.value].push(word);
          workDraft = { text: what.value, direction: direction.value, minutes: minutes.value, clock: clockInput.value };
          await save();
        };
        guess.appendChild(document.createElement("br"));
        guess.appendChild(ask);
      };
      const clockInput = document.createElement("input");
      clockInput.type = "time";
      clockInput.title = "Время ноутбука";
      const tick = new Date();
      clockInput.value = String(tick.getHours()).padStart(2, "0") + ":" + String(tick.getMinutes()).padStart(2, "0");
      const what = document.createElement("input");
      what.type = "text";
      what.placeholder = "Чем занимался";
      what.oninput = refreshGuess;
      direction.onchange = () => { delete skill.dataset.hand; refreshGuess(); };
      skill.onchange = () => { skill.dataset.hand = "1"; refreshGuess(); };
      extraA.onchange = refreshGuess;
      extraB.onchange = refreshGuess;
      if (workDraft) {
        what.value = workDraft.text || "";
        if ([...direction.options].some((opt) => opt.value === workDraft.direction)) direction.value = workDraft.direction;
        minutes.value = workDraft.minutes || "";
        clockInput.value = workDraft.clock || clockInput.value;
        workDraft = null;
      }
      refreshGuess();
      const add = document.createElement("button");
      add.type = "button";
      add.textContent = "Записать";
      add.onclick = async () => {
        const count = minutes.value === "" ? 0 : Number(minutes.value);
        if ((minutes.value !== "" && (!count || count < 1)) || !what.value.trim()) return;
        const day = new Date();
        const iso = day.getFullYear() + "-" + String(day.getMonth() + 1).padStart(2, "0") + "-" + String(day.getDate()).padStart(2, "0");
        const clock = clockInput.value || (String(day.getHours()).padStart(2, "0") + ":" + String(day.getMinutes()).padStart(2, "0"));
        await changeLogs(() => {
          data.logs = data.logs || [];
          const picked = suggestTimeSkills(direction.value, what.value);
          const main = skill.value || picked.skill;
          data.logs.push({ date: iso, minutes: count, direction: direction.value, skill: main, extra: chosenExtras(picked.extra, extraA.value, extraB.value, main), text: what.value.trim(), clock: clock });
        });
      };
      row.append(clockInput, minutes, direction, skill, extraA, extraB, what, add);
      form.append(lead, row, guess);
      root.appendChild(form);
      const now = new Date();
      const month = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
      const totals = {};
      timeRows().forEach((rowLog) => {
        if (month && !String(rowLog.date || "").startsWith(month)) return;
        const key = rowLog.direction || "Другое";
        const mins = Number(rowLog.minutes || 0);
        if (mins > 0) totals[key] = (totals[key] || 0) + mins;
      });
      const stats = document.createElement("section");
      const head = document.createElement("h2");
      head.textContent = "Куда ушло время";
      stats.appendChild(head);
      const pairs = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      if (!pairs.length) {
        const empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = "Пока пусто. Первая запись появится в сводке.";
        stats.appendChild(empty);
      } else stats.appendChild(pie(pairs));
      root.appendChild(stats);
      const list = document.createElement("section");
      const listHead = document.createElement("h2");
      listHead.textContent = "Записи";
      list.appendChild(listHead);
      logs.slice().reverse().forEach((rowLog) => {
        const item = document.createElement("div");
        item.className = "stat";
        const label = document.createElement("span");
        const spent = Number(rowLog.minutes) > 0 ? rowLog.minutes + " мин · " : "";
        const day = rowLog.date ? rowLog.date.slice(8, 10) + "." + rowLog.date.slice(5, 7) : "";
        const when = rowLog.clock || "без времени";
        const fed = rowLog.skill && skillName[rowLog.skill] ? [rowLog.skill, ...(rowLog.extra || [])].map((id) => skillName[id] || id).join(" + ") + " · " : "";
        label.textContent = when + " · " + day + " · " + rowLog.direction + " · " + fed + spent + rowLog.text;
        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "quiet";
        edit.textContent = "Править";
        edit.onclick = () => {
          item.replaceChildren();
          const mins = document.createElement("input");
          mins.type = "number";
          mins.min = "0";
          mins.placeholder = "Минуты";
          mins.value = Number(rowLog.minutes) > 0 ? String(rowLog.minutes) : "";
          const pick = document.createElement("select");
          names.forEach((name) => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            if (name === rowLog.direction) opt.selected = true;
            pick.appendChild(opt);
          });
          if (rowLog.direction && !names.includes(rowLog.direction)) {
            const opt = document.createElement("option");
            opt.value = rowLog.direction;
            opt.textContent = rowLog.direction;
            opt.selected = true;
            pick.appendChild(opt);
          }
          const feed = skillPick(rowLog.skill);
          const extraA = skillPick((rowLog.extra || [])[0] || "", "Доп. не обязательно");
          const extraB = skillPick((rowLog.extra || [])[1] || "", "Доп. не обязательно");
          const feedHint = document.createElement("p");
          feedHint.className = "hint";
          const refreshEdit = () => {
            const picked = suggestTimeSkills(pick.value, what.value);
            if (!feed.dataset.hand) feed.value = picked.skill;
            const extra = chosenExtras(picked.extra, extraA.value, extraB.value, feed.value);
            feedHint.textContent = "Пойдёт в: " + [feed.value, ...extra].filter(Boolean).map(skillTitle).join(" + ");
          };
          const clock = document.createElement("input");
          clock.type = "time";
          clock.value = rowLog.clock || "";
          const what = document.createElement("input");
          what.type = "text";
          what.value = rowLog.text || "";
          what.oninput = refreshEdit;
          feed.dataset.hand = "1";
          pick.onchange = () => { delete feed.dataset.hand; refreshEdit(); };
          feed.onchange = () => { feed.dataset.hand = "1"; refreshEdit(); };
          extraA.onchange = refreshEdit;
          extraB.onchange = refreshEdit;
          refreshEdit();
          const saveRow = document.createElement("button");
          saveRow.type = "button";
          saveRow.textContent = "Сохранить";
          saveRow.onclick = async () => {
            const count = mins.value === "" ? 0 : Number(mins.value);
            if ((mins.value !== "" && (!count || count < 1)) || !what.value.trim()) return;
            await changeLogs(() => {
              rowLog.minutes = count;
              rowLog.direction = pick.value;
              const picked = suggestTimeSkills(pick.value, what.value);
              rowLog.skill = feed.value || picked.skill;
              rowLog.extra = chosenExtras(picked.extra, extraA.value, extraB.value, rowLog.skill);
              rowLog.clock = clock.value;
              rowLog.text = what.value.trim();
            });
          };
          const box = document.createElement("div");
          box.className = "work-form";
          box.append(mins, pick, feed, extraA, extraB, clock, what, saveRow, feedHint);
          item.appendChild(box);
        };
        const drop = document.createElement("button");
        drop.type = "button";
        drop.className = "x";
        drop.textContent = "×";
        drop.onclick = async () => {
          if (!confirm("Удалить запись?")) return;
          await changeLogs(() => { data.logs = (data.logs || []).filter((x) => x !== rowLog); });
        };
        item.append(label, edit, drop);
        list.appendChild(item);
      });
      root.appendChild(list);
    }
    load();
    renderFocusIsland();
    setInterval(renderFocusIsland, 1000);
    setInterval(() => checkNotifications(false), 300000);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
